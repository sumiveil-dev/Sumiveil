[package]
name = "sumiveil-cli"
description = "Sumiveil command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "sumiveil"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
globset = "0.4.20"
sumiveil-core = { path = "../sumiveil-core" }
serde_json = "1.0.151"
toml = "1.1.6"
walkdir = "2.5.0"

[build-dependencies]
winresource = "0.1"
