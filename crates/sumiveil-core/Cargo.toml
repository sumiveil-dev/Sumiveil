[package]
name = "sumiveil-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
aho-corasick = "1.1.5"
cfb = "0.15.0"
chardetng = "1.0.0"
directories = "6.0.0"
encoding_rs = "0.8.41"
fancy-regex = "0.19.2"
globset = "0.4.20"
hex = "0.4.3"
hmac = "0.13.0"
lindera = { version = "6.0.0", default-features = false, optional = true, features = ["mmap"] }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
once_cell = "1.21.4"
pdf-extract = "0.12.1"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sys-locale = "0.3.2"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = ["morphology"]
# 形態素解析 (Lindera + IPADIC) による固有名詞検出。辞書は実行時に外部フォルダから読み込む (任意)
morphology = ["dep:lindera"]

[[example]]
name = "build-morph-dict"
required-features = ["morphology"]
